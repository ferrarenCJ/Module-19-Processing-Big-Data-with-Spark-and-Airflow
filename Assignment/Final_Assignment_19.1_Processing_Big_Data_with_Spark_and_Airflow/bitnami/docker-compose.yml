version: "3.9"

services:
  spark:
    image: apache/spark:3.5.1
    # Keeping the container name as bitnami_spark_1 to match the original configuration and avoid potential issues with existing scripts or configurations that reference this name.
    container_name: bitnami_spark_1
    hostname: spark

    environment:
      SPARK_MODE: master

      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"

      SPARK_USER: spark

      # PATH: /opt/spark/bin:/opt/spark/sbin:$PATH

    command: >
      bash -c "
        /opt/spark/sbin/start-master.sh &&
        tail -f /dev/null
      "

    ports:
      - "8080:8080"
      - "7077:7077"

    networks:
      - spark-network

  spark-worker:
    image: apache/spark:3.5.1
    # Keeping the container name as bitnami_spark-worker-1 to match the original configuration and avoid potential issues with existing scripts or configurations that reference this name.
    container_name: bitnami_spark-worker-1
    hostname: spark-worker

    depends_on:
      - spark

    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark:7077

      SPARK_WORKER_MEMORY: 1G
      SPARK_WORKER_CORES: 1

      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"

      SPARK_USER: spark

      # PATH: /opt/spark/bin:/opt/spark/sbin:$PATH

    command: >
      bash -c "
        export SPARK_WORKER_MEMORY=1G &&
        export SPARK_WORKER_CORES=1 &&
        /opt/spark/sbin/start-worker.sh spark://spark:7077 &&
        tail -f /dev/null
      "

    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge
